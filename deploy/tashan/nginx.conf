user www-data;
worker_processes 1;
pid /tmp/preview-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  map $http_x_forwarded_proto $forwarded_proto { default https; http http; https https; }
  server {
    listen 8080;
    server_name __PREVIEW_HOST__;
    root /opt/web;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "connect-src 'self' __OSS_ORIGIN__; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Tuyan-Environment "isolated-preview" always;
    client_max_body_size 16m;
    location /api/ {
      proxy_pass http://127.0.0.1:3005;
      proxy_set_header Host __PREVIEW_HOST__;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 900s;
    }
    location = /ready { proxy_pass http://127.0.0.1:3005/ready; }
    location = /health { proxy_pass http://127.0.0.1:3005/health; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / { try_files $uri $uri/index.html /index.html; }
    location ~ /\.(?!well-known/) { deny all; }
  }
}
